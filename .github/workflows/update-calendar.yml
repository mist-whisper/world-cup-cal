name: Update World Cup Calendar

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: # 允许手动点击运行
  push:
    branches:
      - main
      - master
    paths:
      - 'src/**'
      - 'index.js'
      - 'package.json'
      - '*.js' # 👈 新增：如果你的常量配置文件在根目录下，确保它被修改时能触发自动化流程

# 全局环境变量
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # 👈 核心修改：强制 Actions 运行在 Node 24，彻底消除黄色警告

# 显式声明权限，防止仓库安全策略变动导致运行失败
permissions:
  contents: write # 允许推送生成的 ics 文件回仓库
  issues: write   # 允许在运行失败时创建 Issue 提醒

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # 保持稳定的 Node 环境
      
      - name: Install dependencies
        run: npm install
      
      - name: Generate calendar
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SEASON_YEAR: 2026
          CACHE_DURATION_HOURS: 24
        run: node index.js
      
      - name: Check for changes
        id: check_changes
        run: |
          git add WorldCupSchedule.ics
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "chore: update World Cup calendar [skip ci]" -m "Auto-generated by GitHub Actions"
          git push
      
      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '⚠️ Calendar Update Failed',
              body: `## Calendar Update Failed\n\nThe automated calendar update failed.\n\n**Error Details:**\n\`\`\`\n${process.env.ERROR_MESSAGE || 'Check the workflow logs for details'}\n\`\`\`\n\n**Workflow Run:** [View Logs](${process.env.GITHUB_SERVER_URL}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})\n\n**Time:** ${new Date().toISOString()}\n\nPlease check the workflow logs and fix the issue.`,
              labels: ['automated', 'bug']
            })
