- name: Create Release
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          CURRENT_VERSION="${{ steps.package_version.outputs.version }}"
          RELEASE_NOTES="${{ steps.release_notes.outputs.notes }}"
          
          echo "步骤1：开始创建 Release 基础标签..."
          gh release create "v$CURRENT_VERSION" --title "World Cup Calendar v$CURRENT_VERSION" --notes "$RELEASE_NOTES" --target master
          
          echo "步骤2：开始单独上传日历附件..."
          gh release upload "v$CURRENT_VERSION" WorldCupSchedule.ics --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
