name: Auto Release

on:
  push:
    branches:
      - master
      - main
    paths:
      - 'package.json' # 手动修改版本号时才触发
  workflow_dispatch: # 手动测试

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 拿到完整的 commit 历史用于生成日志
          
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      - name: Install dependencies
        run: npm install
        
      - name: Generate calendar artifact
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          SEASON_YEAR: 2026
        run: node index.js
      
      - name: Get package version
        id: package_version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Current version: $VERSION"
      
      - name: Get latest release
        id: latest_release
        run: |

          LATEST_RELEASE=$(gh release view --json tagName --jq '.tagName' 2>/dev/null | sed 's/^v//' || echo "")
          echo "latest_release=$LATEST_RELEASE" >> $GITHUB_OUTPUT
          echo "Latest release: $LATEST_RELEASE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check if new release is needed
        id: check_release
        run: |
          CURRENT_VERSION="${{ steps.package_version.outputs.version }}"
          LATEST_RELEASE="${{ steps.latest_release.outputs.latest_release }}"
          
          if [ -z "$LATEST_RELEASE" ]; then
            echo "No existing release found, will create first release"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "previous_tag=" >> $GITHUB_OUTPUT
          elif [ "$CURRENT_VERSION" != "$LATEST_RELEASE" ]; then
            echo "Version changed from $LATEST_RELEASE to $CURRENT_VERSION"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "previous_tag=v$LATEST_RELEASE" >> $GITHUB_OUTPUT
          else
            echo "Version unchanged, no release needed"
            echo "should_release=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Generate release notes
        id: release_notes
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          PREVIOUS_TAG="${{ steps.check_release.outputs.previous_tag }}"
          CURRENT_VERSION="${{ steps.package_version.outputs.version }}"
          
          if [ -z "$PREVIOUS_TAG" ]; then
            COMMITS=$(git log --pretty=format:"- %s (%h)" --no-merges)
          else
            COMMITS=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s (%h)" --no-merges | grep -v "\[skip ci\]"|| true)
            COMMITS=$(echo "$COMMITS" | grep -v "Auto-generated by GitHub Actions" || true)
          fi
          
          if [ -z "$COMMITS" ]; then
            COMMITS="常规性能优化与代码维护"
          fi
          
          cat > release_notes.md << EOF
          ## 🔄 本次版本更新 (v$CURRENT_VERSION)
          
          ### 🛠️ 变更详情
          $COMMITS
          
          ### 🔗 订阅资产
          - 附件中已打包当前版本的日历静态文件 \`WorldCupSchedule.ics\`。
          - 通过 Cloudflare Worker 域名或私有 CDN 地址拉取。
          EOF
          
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Release
        if: steps.check_release.outputs.should_release == 'true'
        run: |
          CURRENT_VERSION="${{ steps.package_version.outputs.version }}"
          RELEASE_NOTES="${{ steps.release_notes.outputs.notes }}"
          
          gh release create "v$CURRENT_VERSION" WorldCupSchedule.ics --title "World Cup Calendar v$CURRENT_VERSION" --notes "$RELEASE_NOTES" --target master
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
